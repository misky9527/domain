version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    user: "1000:1000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    # ports:  # 去掉 = 不对外暴露，external 访问全部走 nginx
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    user: "1000:1000"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "5173:5173"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'
